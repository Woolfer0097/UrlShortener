services:
  url-shortener:
    container_name: url-shortener
    image: woolfer0097kek/url-shortener:1.0.0
    env_file:
      - .env
    ports:
      - 8080:8080
    depends_on:
      - postgres
    networks:
      - url-shortener-network

  postgres:
    container_name: postgres
    image: postgres:16
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url-shortener
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - url-shortener-network

volumes:
  postgres-data:


networks:
  url-shortener-network:
    driver: bridge